name: Geometry cache regression tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Exercise cache dispatch and failure recovery
        run: python3 tests/geometry_cache/run.py
